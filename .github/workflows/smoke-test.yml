name: CLI Smoke Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      
      - name: Install videowise
        run: pip install -e .
      
      - name: Verify FFmpeg installation
        run: |
          echo "=== FFmpeg version ==="
          ffmpeg -version
          echo ""
          echo "=== FFprobe version ==="
          ffprobe -version
      
      - name: Create test video (H.264 high profile)
        run: |
          echo "=== Creating test video ==="
          ffmpeg -f lavfi -i testsrc=duration=1:size=1280x720:rate=30 \
            -c:v libx264 -profile:v high -level 4.1 -pix_fmt yuv420p \
            -colorspace bt709 -color_primaries bt709 -color_trc bt709 \
            -t 1 test_video.mp4 -y
          
          echo ""
          echo "=== Video created, checking with FFprobe ==="
          ffprobe -v error -show_streams -show_format test_video.mp4
          
          echo ""
          echo "=== Extracting codec and profile ==="
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,profile \
            -of default=noprint_wrappers=1 test_video.mp4
          
          echo ""
          echo "=== FFprobe JSON output (what VideoAnalyzer should see) ==="
          ffprobe -v quiet -print_format json -show_format -show_streams test_video.mp4
      
      - name: Debug VideoAnalyzer directly
        run: |
          echo "=== Testing VideoAnalyzer directly ==="
          python3 << 'PYTHON_EOF'
          from videowise.analyzer import VideoAnalyzer
          import json
          
          analyzer = VideoAnalyzer("test_video.mp4")
          metadata = analyzer.get_metadata()
          
          print("Metadata returned by get_metadata():")
          print(json.dumps(metadata, indent=2) if metadata else "None")
          print()
          
          print(f"Codec name: {analyzer.get_codec_name()}")
          print(f"Codec profile: {analyzer.get_codec_profile()}")
          print(f"Container: {analyzer.get_container_format()}")
          print(f"Resolution: {analyzer.get_resolution()}")
          print(f"Frame rate: {analyzer.get_frame_rate()}")
          print(f"Bitrate: {analyzer.get_bitrate()}")
          PYTHON_EOF
      
      - name: Test videowise check
        run: |
          echo "=== Testing videowise check command ==="
          echo "File: test_video.mp4"
          echo ""
          
          if videowise check test_video.mp4 --system casparcg --verbose; then
            echo ""
            echo "✓ Test passed: Video is compatible with CasparCG"
            exit 0
          else
            EXIT_CODE=$?
            echo ""
            echo "✗ Test failed with exit code: $EXIT_CODE"
            echo ""
            echo "=== Detailed FFprobe output ==="
            ffprobe -v error -show_format -show_streams test_video.mp4
            exit 1
          fi
