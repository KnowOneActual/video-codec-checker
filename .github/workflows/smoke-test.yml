name: CLI Smoke Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      
      - name: Install videowise
        run: pip install -e .
      
      - name: Verify FFmpeg installation
        run: |
          echo "=== FFmpeg version ==="
          ffmpeg -version
          echo ""
          echo "=== FFprobe version ==="
          ffprobe -version
      
      - name: Create test video (H.264 baseline)
        run: |
          echo "=== Creating test video ==="
          ffmpeg -f lavfi -i testsrc=duration=1:size=1280x720:rate=30 \
            -c:v libx264 -profile:v baseline -pix_fmt yuv420p \
            -colorspace bt709 -color_primaries bt709 -color_trc bt709 \
            -t 1 test_video.mp4 -y
          
          echo ""
          echo "=== Video created, checking with FFprobe ==="
          ffprobe -v error -show_streams -show_format test_video.mp4
          
          echo ""
          echo "=== Extracting codec and profile ==="
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,profile \
            -of default=noprint_wrappers=1 test_video.mp4
      
      - name: Test videowise check
        run: |
          echo "=== Testing videowise check command ==="
          echo "File: test_video.mp4"
          echo ""
          
          if videowise check test_video.mp4 --system casparcg --verbose; then
            echo ""
            echo "✓ Test passed: Video is compatible with CasparCG"
            exit 0
          else
            EXIT_CODE=$?
            echo ""
            echo "✗ Test failed with exit code: $EXIT_CODE"
            echo ""
            echo "=== Detailed FFprobe output ==="
            ffprobe -v error -show_format -show_streams test_video.mp4
            exit 1
          fi
