[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "videowise"
version = "0.1.0"
description = "Video codec compatibility checker for live production and content creation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Beau Bremer", email = "beau.bremer@gmail.com"}
]
maintainers = [
    {name = "Beau Bremer", email = "beau.bremer@gmail.com"}
]
keywords = ["video", "codec", "compatibility", "ffmpeg", "live-production", "casparcg", "vmix", "obs", "qlab", "propresenter", "content-creation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Conversion",
    "Topic :: System :: Systems Administration",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

dependencies = [
    "click>=8.1.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0.0",
    "pre-commit>=2.21.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/KnowOneActual/video-codec-checker"
Documentation = "https://github.com/KnowOneActual/video-codec-checker/blob/main/README.md"
"Bug Tracker" = "https://github.com/KnowOneActual/video-codec-checker/issues"
Changelog = "https://github.com/KnowOneActual/video-codec-checker/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/KnowOneActual/video-codec-checker/blob/main/ROADMAP.md"

[project.scripts]
videowise = "videowise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]
exclude = '''
/(
    \.git
  | \.venv
  | \.eggs
  | \.pytest_cache
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["videowise"]
src_paths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]

[tool.coverage.run]
source = ["src/videowise"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
