# System Profiles - Rule-Based Compatibility Configuration
# Each system defines its compatibility rules declaratively

# PROFILES GROUP SYSTEMS BY WORKFLOW
profiles:
  live_production:
    systems:
      - casparcg
      - playoutbee
      - vmix
      - obs
      - qlab
      - propresenter
      - wirecast
      - playbackpro
      - easyworship
      - provideoplayer
  
  editing:
    systems:
      - davinci
      - premiere
      - finalcut
      - avid
      - aftereffects
  
  social_media:
    systems:
      - instagram
      - twitter
      - youtube
      - tiktok
      - vimeo
      - facebook
  
  streaming:
    systems:
      - twitch
      - youtubelive
      - kick
      - restream
      - zoom
      - discord
  
  browsers:
    systems:
      - safari
      - chrome
      - firefox
  
  media_players:
    systems:
      - vlc
      - resolume
      - mitti
      - millumin

# SYSTEM DEFINITIONS
systems:
  # === LIVE PRODUCTION ===
  casparcg:
    name: "CasparCG Server"
    category: live_production
    codecs:
      supported: [h264, prores, dnxhd, dnxhr, mpeg2video, mjpeg, hap, notchlc]
      optimal: [hap, prores, dnxhd]
      gpu_accelerated: [hap, notchlc]
      alpha_support: [prores4444, hap_alpha, hap_q_alpha]
    containers:
      preferred:
        h264: [mp4, mov]
        prores: [mov]
        dnxhd: [mov, mxf]
        dnxhr: [mov, mxf]
        hap: [mov]
    rules:
      # Explicit compatibility for standard supported codecs
      - condition: {codec_in: [h264, prores, dnxhd, dnxhr, mpeg2video, mjpeg]}
        level: compatible
        message: "{codec} is supported by CasparCG Server"
        reason: "CasparCG supports this codec for reliable playback"
      
      - condition: {codec_contains: "hap"}
        level: compatible
        message: "HAP codec provides GPU-accelerated playback"
        reason: "Optimal for real-time playback in CasparCG"
      
      - condition: {codec_eq: "prores", profile_contains: "4444"}
        level: compatible
        message: "ProRes 4444 supports alpha channel for transparency"
        reason: "Professional quality with transparency support"
      
      - condition: {codec_not_in: [h264, prores, dnxhd, dnxhr, mpeg2video, mjpeg, hap, notchlc]}
        level: incompatible
        message: "CasparCG does not support {codec} codec"
        suggestion: "Convert to HAP (GPU-accelerated), ProRes, DNxHD, or H.264"
      
      - condition: {resolution_gte: [3840, 2160], bitrate_gt: 200000000}
        level: warning
        message: "4K at {bitrate_mbps}Mbps may stress system bandwidth"
        suggestion: "Consider HAP codec for GPU-accelerated 4K playback"
  
  playoutbee:
    name: "PlayoutBee"
    category: live_production
    codecs:
      supported: [h264, prores, hap]
      optimal: [hap]
      alpha_support: [prores4444, hap_alpha, hap_q_alpha]
    containers:
      preferred:
        hap: [mov]
        h264: [mp4, mov]
        prores: [mov]
    rules:
      - condition: {codec_contains: "hap"}
        level: compatible
        message: "HAP codec is optimal for PlayoutBee"
        reason: "GPU-accelerated real-time playback with low CPU usage"
      
      - condition: {codec_eq: "h264"}
        level: compatible
        message: "H.264 is compatible with PlayoutBee"
        reason: "Hardware acceleration available, good compatibility"
  
  vmix:
    name: "vMix"
    category: live_production
    rules:
      - condition: {bitrate_gt: 200000000}
        level: warning
        message: "Very high bitrate ({bitrate_mbps}Mbps) may cause dropped frames"
        suggestion: "Consider transcoding to 100-150Mbps"
      
      - condition: {bitrate_gt: 100000000}
        level: warning
        message: "High bitrate ({bitrate_mbps}Mbps) - monitor for performance issues"
        suggestion: "Test playback before going live"
      
      - condition: {codec_in: [prores, dnxhd, dnxhr]}
        level: compatible
        message: "{codec} is well-supported by vMix"
  
  obs:
    name: "OBS Studio"
    category: live_production
    codecs:
      supported: [h264, hevc, av1, vp8, vp9, prores, dnxhd]
      recommended: [h264, hevc, av1]
    rules:
      - condition: {codec_in: [h264, hevc, av1]}
        level: compatible
        message: "{codec} is fully supported by OBS Studio"
        reason: "Hardware acceleration may be available"
      
      - condition: {codec_not_in: [h264, hevc, av1, vp8, vp9, prores, dnxhd]}
        level: warning
        message: "{codec} may have limited support in OBS"
        suggestion: "Consider converting to H.264 for compatibility"
  
  qlab:
    name: "QLab"
    category: live_production
    codecs:
      optimal: [prores_proxy, prores_lt, prores]
      supported: [h264, prores, prores4444]
      alpha_support: [prores4444]
    containers:
      preferred: [mov, mp4]
    rules:
      - condition: {codec_contains: "prores", codec_contains: "proxy"}
        level: compatible
        message: "ProRes Proxy provides best performance in QLab"
        reason: "ProRes Proxy and LT optimize for playback"
      
      - condition: {codec_contains: "prores", codec_contains: "lt"}
        level: compatible
        message: "ProRes LT provides best performance in QLab"
        reason: "ProRes Proxy and LT optimize for playback"
      
      - condition: {codec_contains: "prores", profile_contains: "4444"}
        level: compatible
        message: "ProRes 4444 supports alpha channel (transparency)"
        reason: "Required for videos with transparency"
      
      - condition: {codec_contains: "prores"}
        level: compatible
        message: "{codec} is compatible with QLab"
        reason: "QLab works best with ProRes codecs"
      
      - condition: {codec_eq: "h264"}
        level: warning
        message: "H.264 performs poorly when scrubbing or changing speed"
        reason: "H.264 is not optimized for variable-speed playback"
        suggestion: "Convert to ProRes 422 Proxy or LT"
      
      - condition: {container_not_contains: "mov", container_not_contains: "mp4"}
        level: warning
        message: "QLab works best with MOV or MP4 containers"
        suggestion: "Remux to MOV container"
  
  propresenter:
    name: "ProPresenter"
    category: live_production
    codecs:
      supported: [h264, hevc, prores, prores4444, hap]
      optimal: [hap]
      alpha_support: [prores4444, hap_alpha]
    containers:
      preferred: [mov, mp4]
    rules:
      - condition: {codec_contains: "hap"}
        level: compatible
        message: "HAP codec provides best performance in ProPresenter"
        reason: "HAP is GPU-accelerated for real-time playback"
      
      - condition: {codec_contains: "prores", profile_contains: "4444"}
        level: compatible
        message: "ProRes 4444 supports alpha channel"
        reason: "Transparency support for overlays"
      
      - condition: {codec_contains: "prores"}
        level: compatible
        message: "ProRes is fully supported by ProPresenter"
        reason: "Professional codec with good quality"
      
      - condition: {codec_eq: "h264"}
        level: compatible
        message: "H.264 is compatible with ProPresenter"
        reason: "Hardware acceleration available"
      
      - condition: {codec_not_in: [h264, hevc, prores, hap]}
        level: incompatible
        message: "ProPresenter does not support {codec} codec"
        suggestion: "Convert to H.264, ProRes, or HAP codec"
      
      - condition: {container_not_contains: "mov", container_not_contains: "mp4"}
        level: warning
        message: "ProPresenter works best with MOV or MP4 containers"
        suggestion: "Remux to MOV or MP4 container"
  
  wirecast:
    name: "Wirecast"
    category: live_production
    codecs:
      optimal: [prores, h264]
      supported: [h264, hevc, prores, dnxhd, dnxhr, mjpeg]
    containers:
      preferred: [mov, mp4]
    rules:
      - condition: {codec_contains: "prores"}
        level: compatible
        message: "{codec} is optimal for Wirecast"
        reason: "ProRes provides excellent real-time performance"
      
      - condition: {codec_in: [h264, hevc]}
        level: compatible
        message: "{codec} is supported by Wirecast"
        reason: "Hardware acceleration available for live streaming"
      
      - condition: {codec_in: [dnxhd, dnxhr]}
        level: compatible
        message: "{codec} is well-supported by Wirecast"
        reason: "Professional codec for broadcast workflows"
      
      - condition: {bitrate_gt: 150000000}
        level: warning
        message: "High bitrate ({bitrate_mbps}Mbps) may impact live streaming performance"
        suggestion: "Consider 50-100Mbps for optimal live production"
      
      - condition: {container_not_contains: "mov", container_not_contains: "mp4"}
        level: warning
        message: "Wirecast works best with MOV or MP4 containers"
        suggestion: "Use MOV or MP4 for best compatibility"
  
  playbackpro:
    name: "PlaybackPro"
    category: live_production
    codecs:
      optimal: [hap, prores]
      supported: [h264, prores, hap]
      alpha_support: [prores4444, hap_alpha, hap_q_alpha]
    containers:
      preferred:
        hap: [mov]
        prores: [mov]
        h264: [mov, mp4]
    rules:
      - condition: {codec_contains: "hap"}
        level: compatible
        message: "HAP codec is optimal for PlaybackPro"
        reason: "GPU-accelerated for multiple simultaneous video layers"
      
      - condition: {codec_contains: "prores"}
        level: compatible
        message: "{codec} is well-supported in PlaybackPro"
        reason: "Professional quality for live production"
      
      - condition: {codec_eq: "h264"}
        level: warning
        message: "H.264 may have performance issues with multiple layers"
        reason: "H.264 decoding is CPU-intensive"
        suggestion: "Use HAP for multi-layer playback or ProRes for quality"
      
      - condition: {resolution_gte: [3840, 2160]}
        level: warning
        message: "4K playback requires powerful GPU for smooth performance"
        suggestion: "Use HAP codec for 4K multi-layer playback"

      - condition: {codec_not_in: [h264, prores, hap]}
        level: warning
        message: "{codec} may not be optimal for PlaybackPro"
        suggestion: "Convert to ProRes 422 for best reliability"

      - condition: {container_not_contains: "mov"}
        level: incompatible
        message: "PlaybackPro requires MOV container"
        reason: "PlaybackPro only supports MOV container"
        suggestion: "Remux to MOV container"
  
  easyworship:
    name: "EasyWorship"
    category: live_production
    codecs:
      native: [h264]
      supported: [h264, wmv, mpeg2video]
    containers:
      preferred: [mp4, mov, m4v]
      windows_native: [wmv, avi]
    rules:
      - condition: {codec_eq: "h264", container_contains: "mp4"}
        level: compatible
        message: "H.264 in MP4 has native support in EasyWorship 7+"
        reason: "No additional codecs required"
      
      - condition: {codec_eq: "h264", container_contains: "mov"}
        level: compatible
        message: "H.264 in MOV has native support in EasyWorship 7+"
        reason: "No additional codecs required"
      
      - condition: {codec_eq: "h264"}
        level: compatible
        message: "H.264 is supported by EasyWorship"
        reason: "H.264 works in most containers"
      
      - condition: {codec_in: [wmv, mpeg2video]}
        level: compatible
        message: "{codec} is supported on Windows"
        reason: "Windows Media codecs built into Windows OS"
      
      - condition: {codec_not_in: [h264, wmv, mpeg2video]}
        level: warning
        message: "{codec} may require additional codecs"
        reason: "EasyWorship 7+ natively supports H.264 in MP4/MOV"
        suggestion: "Convert to H.264 in MP4 for guaranteed compatibility"
      
      - condition: {container_in: [wmv, avi]}
        level: compatible
        message: "{container} is supported on Windows"
        reason: "Windows Media formats built into Windows"
  
  provideoplayer:
    name: "ProVideoPlayer"
    category: live_production
    codecs:
      optimal: [hap, prores, dxv]
      supported: [h264, hevc, prores, hap, dxv]
      alpha_support: [prores4444, hap_alpha, hap_q_alpha]
    containers:
      preferred:
        hap: [mov]
        prores: [mov]
        h264: [mov, mp4]
    rules:
      - condition: {codec_contains: "hap"}
        level: compatible
        message: "HAP codec is optimal for ProVideoPlayer"
        reason: "GPU-accelerated for real-time multi-output playback"
      
      - condition: {codec_contains: "prores"}
        level: compatible
        message: "{codec} is well-supported in ProVideoPlayer"
        reason: "Hardware acceleration on Apple Silicon"

      - condition: {codec_contains: "dxv"}
        level: compatible
        message: "DXV codec works perfectly with PVP timecode features"
        reason: "GPU-accelerated with excellent timecode sync"
      
      - condition: {codec_in: [h264, hevc]}
        level: compatible
        message: "{codec} is supported by ProVideoPlayer"
        reason: "Hardware decoding available on Mac"
      
      - condition: {resolution_gte: [3840, 2160]}
        level: warning
        message: "4K requires HAP codec for multi-output performance"
        suggestion: "Use HAP for 4K multi-projector setups"

      - condition: {codec_not_in: [h264, hevc, prores, hap, dxv]}
        level: warning
        message: "PVP may have limited support for {codec}"
        reason: "PVP works best with DXV, HAP, ProRes, or H.264"
        suggestion: "Convert to DXV for optimal timecode and multi-screen performance"
  
  # === MEDIA PLAYERS / VJ SOFTWARE ===
  vlc:
    name: "VLC Media Player"
    category: media_players
    codecs:
      supported: [h264, hevc, vp8, vp9, av1, prores, dnxhd, dnxhr, mjpeg, mpeg2video]
      hardware_accelerated: [h264, hevc, vp9, av1]
    rules:
      - condition: {codec_in: [h264, hevc, vp9, av1]}
        level: compatible
        message: "{codec} may benefit from hardware acceleration"
        reason: "Enable hardware decoding in VLC preferences for better performance"
      
      - condition: {bitrate_gt: 300000000}
        level: warning
        message: "Very high bitrate ({bitrate_mbps}Mbps) may cause stuttering"
        reason: "Extreme bitrates can exceed disk I/O capabilities"
        suggestion: "Ensure fast storage (NVMe SSD) for smooth playback"
      
      - condition: {resolution_gte: [7680, 4320]}
        level: warning
        message: "8K video requires powerful hardware"
        reason: "8K playback needs modern CPU/GPU and fast storage"
        suggestion: "Enable hardware decoding and use VLC 3.0+"
  
  resolume:
    name: "Resolume"
    category: media_players
    codecs:
      optimal: [hap, dxv]
      supported: [h264, hevc, prores, hap, dxv]
      alpha_support: [hap_alpha, hap_q_alpha, dxv_alpha]
      gpu_accelerated: [hap, dxv]
    containers:
      preferred:
        hap: [mov]
        dxv: [mov, avi]
    rules:
      - condition: {codec_contains: "hap"}
        level: compatible
        message: "HAP is optimal for Resolume VJ performance"
        reason: "GPU-accelerated for real-time effects and compositing"
      
      - condition: {codec_contains: "dxv"}
        level: compatible
        message: "DXV is optimal for Resolume on Windows"
        reason: "DirectX GPU-accelerated codec for VJ workflows"
      
      - condition: {codec_contains: "prores"}
        level: warning
        message: "ProRes works but HAP/DXV recommended for VJ performance"
        reason: "ProRes is CPU-based, can limit real-time effects"
        suggestion: "Convert to HAP (Mac/Windows) or DXV (Windows) for GPU acceleration"
      
      - condition: {codec_in: [h264, hevc]}
        level: warning
        message: "{codec} not ideal for real-time VJ performance"
        reason: "Compressed codecs cause lag with effects and layers"
        suggestion: "Convert to HAP or DXV for optimal Resolume performance"
      
      - condition: {resolution_gte: [3840, 2160]}
        level: warning
        message: "4K requires HAP/DXV codec for smooth VJ performance"
        suggestion: "Use HAP or DXV for 4K content with real-time effects"

      - condition: {codec_not_in: [h264, hevc, prores, hap, dxv]}
        level: warning
        message: "{codec} may not be optimal for Resolume"
        reason: "Resolume works best with DXV, HAP, or PhotoJPEG"
        suggestion: "Convert to DXV for best performance"
  
  mitti:
    name: "Mitti"
    category: media_players
    codecs:
      optimal: [prores, hap]
      supported: [h264, hevc, prores, hap]
      alpha_support: [prores4444, hap_alpha, hap_q_alpha]
    containers:
      preferred: [mov]
      supported: [mp4]
    rules:
      - condition: {codec_contains: "prores"}
        level: compatible
        message: "{codec} is optimal for Mitti"
        reason: "Hardware accelerated on Apple Silicon Macs (M1/M2/M3)"
      
      - condition: {codec_contains: "hap", codec_contains: "alpha"}
        level: compatible
        message: "HAP Alpha is optimal for Mitti with transparency"
        reason: "GPU-accelerated playback with alpha channel"
      
      - condition: {codec_contains: "hap"}
        level: compatible
        message: "HAP is optimal for Mitti"
        reason: "GPU-accelerated, especially for 4K and multi-output"
      
      - condition: {codec_not_in: [prores, hap]}
        level: warning
        message: "{codec} should be transcoded for Mitti"
        reason: "Mitti recommends ProRes or HAP for reliable playback"
        suggestion: "Use Mitti's built-in transcoding to ProRes (Apple Silicon) or HAP (multi-output)"
      
      - condition: {container_not_contains: "mov"}
        level: warning
        message: "MOV container is preferred by Mitti"
        suggestion: "Use MOV container for best compatibility"
      
      - condition: {resolution_gte: [3840, 2160]}
        level: warning
        message: "4K video: use HAP for multi-output, ProRes for single output"
        reason: "4K ProRes great on Apple Silicon; 4K HAP better for HDMI/DisplayPort multi-output"
        suggestion: "HAP for GPU path (external displays), ProRes for SDI"
      
      - condition: {bitrate_gt: 250000000}
        level: warning
        message: "High bitrate ({bitrate_mbps}Mbps) may stress playback"
        reason: "Very high bitrate can cause dropped frames"
        suggestion: "Use ProRes 422 or HAP with moderate bitrate"
  
  millumin:
    name: "Millumin"
    category: media_players
    codecs:
      optimal: [prores, hap]
      supported: [h264, hevc, prores, hap]
      alpha_support: [prores4444, hap_alpha, hap_q_alpha]
    containers:
      preferred: [mov]
      supported: [mp4]
    rules:
      - condition: {codec_contains: "prores"}
        level: compatible
        message: "ProRes is excellent for Millumin"
        reason: "Native Mac codec with hardware acceleration on Apple Silicon"
      
      - condition: {codec_contains: "hap"}
        level: compatible
        message: "HAP is optimal for Millumin projection mapping"
        reason: "GPU-accelerated, ideal for multi-projector setups"
      
      - condition: {codec_eq: "h264"}
        level: warning
        message: "H.264 works but ProRes/HAP recommended for projection"
        reason: "H.264 is CPU-based, can limit real-time performance"
        suggestion: "Use ProRes or HAP for better projection mapping performance"
      
      - condition: {container_not_contains: "mov"}
        level: warning
        message: "MOV is the preferred container for Millumin"
        reason: "QuickTime MOV native to macOS"
        suggestion: "Use MOV container for best compatibility"
      
      - condition: {resolution_gte: [3840, 2160]}
        level: warning
        message: "4K video requires powerful Mac for smooth projection"
        reason: "4K projection mapping is GPU-intensive"
        suggestion: "Use HAP codec for best 4K projection performance"
  
  # === BROWSERS ===
  safari:
    name: "Safari Browser"
    category: browsers
    codecs:
      supported: [h264, hevc]
    containers:
      preferred: [mp4]
    rules:
      - condition: {codec_not_in: [h264, hevc]}
        level: incompatible
        message: "Safari does not support {codec} codec"
        reason: "Safari only supports H.264 and HEVC (H.265)"
        suggestion: "Convert to H.264 for maximum browser compatibility"
      
      - condition: {container_not_contains: "mp4"}
        level: warning
        message: "Safari works best with MP4 container format"
        suggestion: "Remux to MP4 container"
  
  chrome:
    name: "Chrome Browser"
    category: browsers
    codecs:
      supported: [h264, vp8, vp9, av1]
    rules:
      - condition: {codec_in: [h264, vp8, vp9, av1]}
        level: compatible
        message: "{codec} is supported by Chrome"
      
      - condition: {codec_not_in: [h264, vp8, vp9, av1]}
        level: warning
        message: "{codec} may not be supported by Chrome"
        suggestion: "Convert to H.264 or VP9 for web compatibility"
  
  firefox:
    name: "Firefox Browser"
    category: browsers
    codecs:
      supported: [h264, vp8, vp9, av1]
      partially_supported: [hevc]
    rules:
      - condition: {codec_in: [vp8, vp9], container_contains: "webm"}
        level: compatible
        message: "{codec} in WebM is natively supported by Firefox"
        reason: "WebM is Firefox's preferred format for VP8/VP9"
      
      - condition: {codec_eq: "h264", container_contains: "mp4"}
        level: compatible
        message: "H.264 in MP4 is fully supported by Firefox"
        reason: "Universal browser compatibility"
      
      - condition: {codec_eq: "av1"}
        level: compatible
        message: "AV1 is supported by Firefox"
        reason: "Modern codec with good efficiency"
      
      - condition: {codec_in: [h264, vp8, vp9]}
        level: compatible
        message: "{codec} is supported by Firefox"
      
      - condition: {codec_eq: "hevc"}
        level: warning
        message: "HEVC has limited support in Firefox"
        reason: "HEVC requires Windows 10+ with HEVC Video Extensions"
        suggestion: "Convert to H.264 or VP9 for broader compatibility"
      
      - condition: {codec_not_in: [h264, vp8, vp9, av1, hevc]}
        level: incompatible
        message: "Firefox does not support {codec} codec"
        reason: "Firefox supports H.264, VP8, VP9, and AV1"
        suggestion: "Convert to H.264 (MP4) or VP9 (WebM) for Firefox"
  
  # === SOCIAL MEDIA ===
  instagram:
    name: "Instagram"
    category: social_media
    codecs:
      required: [h264]
      profiles:
        preferred: [baseline]
    rules:
      - condition: {codec_ne: "h264"}
        level: warning
        message: "Instagram will re-encode {codec} to H.264 (quality loss)"
        suggestion: "Pre-encode to H.264 to maintain quality control"
      
      - condition: {codec_eq: "h264", profile_not_contains: "baseline"}
        level: warning
        message: "Instagram prefers H.264 Baseline, not {profile}"
        suggestion: "Convert to Baseline: ffmpeg -profile:v baseline"
      
      - condition: {resolution_gt: [1080, 1920]}
        level: warning
        message: "Resolution {width}x{height} will be downscaled"
        suggestion: "Downscale to 1080p before upload"
  
  twitter:
    name: "Twitter/X"
    category: social_media
    codecs:
      recommended: [h264]
      profiles:
        preferred: [high]
    containers:
      preferred: [mp4, mov]
    rules:
      - condition: {codec_ne: "h264"}
        level: warning
        message: "Twitter recommends H.264, not {codec}"
        suggestion: "Convert to H.264 High Profile for best quality"
      
      - condition: {codec_eq: "h264"}
        level: compatible
        message: "H.264 codec is supported by Twitter"
      
      - condition: {container_not_contains: "mp4", container_not_contains: "mov"}
        level: warning
        message: "Twitter works best with MP4 or MOV containers"
        suggestion: "Remux to MP4 container"
  
  youtube:
    name: "YouTube"
    category: social_media
    codecs:
      recommended: [h264]
      profiles:
        preferred: [high]
    containers:
      preferred: [mp4]
    rules:
      - condition: {codec_ne: "h264"}
        level: warning
        message: "YouTube recommends H.264, not {codec} for uploads"
        suggestion: "Upload as H.264 for best quality control and processing speed"
      
      - condition: {codec_eq: "h264", profile_contains: "high"}
        level: compatible
        message: "H.264 High Profile is optimal for YouTube"
      
      - condition: {container_contains: "mp4"}
        level: compatible
        message: "MP4 is YouTube's preferred container format"
  
  tiktok:
    name: "TikTok"
    category: social_media
    codecs:
      recommended: [h264]
      profiles:
        preferred: [high]
    containers:
      preferred: [mp4, mov]
    rules:
      - condition: {codec_eq: "h264"}
        level: compatible
        message: "H.264 is the optimal codec for TikTok"
        reason: "Best compatibility across all devices"
      
      - condition: {codec_eq: "hevc"}
        level: warning
        message: "HEVC may cause playback issues on some devices"
